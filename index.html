<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivera Muhasebe Hakediş Paneli</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#07111f,#1d3557,#0b132b);color:white;padding:20px}
.container{max-width:1200px;margin:auto}
.hero,.card{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35);margin-bottom:20px}
h1{margin:0;font-size:32px}
p{opacity:.85}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
label{display:block;font-weight:bold;font-size:14px;margin-top:8px}
input,textarea,select{width:100%;padding:13px;border:none;outline:none;border-radius:14px;margin:8px 0 14px;font-size:15px}
textarea{min-height:260px;resize:vertical}
button{border:none;padding:13px 16px;border-radius:14px;font-weight:bold;cursor:pointer;margin:5px 4px 5px 0}
.primary{background:#00d4ff;color:#06111d}
.success{background:#37ff8b;color:#062011}
.danger{background:#ff4d6d;color:white}
.dark{background:#ffffff22;color:white}
.person{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border-radius:14px;background:rgba(255,255,255,.08);margin-bottom:10px}
.person small{opacity:.75}
.checkbox{width:auto;margin-right:8px;transform:scale(1.2)}
.preview{background:#07111f;border-radius:16px;padding:15px;white-space:pre-wrap;line-height:1.5;border:1px solid rgba(255,255,255,.12);min-height:250px}
.list{max-height:520px;overflow:auto;padding-right:5px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{font-size:13px;opacity:.75;margin-top:8px}
@media(max-width:850px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}h1{font-size:25px}}
</style>
</head>

<body>
<div class="container">

<div class="hero">
<h1>💼 Delivera Muhasebe Hakediş Paneli</h1>
<p>Kişiyi kaydet sağ taraftan haftalık hakediş tutarını gir WhatsApp mesajını hazırla 🚀</p>
</div>

<div class="grid">

<div class="card">
<h2>👤 Kurye / Esnaf Ekle</h2>

<label>İsim Soyisim</label>
<input id="name" placeholder="Örn: Arda Doğan">

<label>Telefon</label>
<input id="phone" placeholder="Örn: 05551234567">

<button class="primary" onclick="addPerson()">Kişiyi Kaydet</button>

<hr style="border-color:#ffffff22">

<div class="row">
<button class="dark" onclick="selectAllPeople()">Tümünü Seç</button>
<button class="dark" onclick="clearSelections()">Seçimi Temizle</button>
</div>

<h2>📋 Kayıtlı Kişiler</h2>
<div id="personList" class="list"></div>
</div>

<div class="card">
<h2>🧾 Hakediş Mesajı Hazırla</h2>

<label>Tekli Önizleme İçin Kişi Seç</label>
<select id="selectedPerson" onchange="loadSelectedAmount(); prepareMessage();"></select>

<label>Seçili Kişinin Bu Haftaki Hakediş Tutarı</label>
<input id="selectedAmount" placeholder="Örn: 7200" oninput="saveSelectedAmount()">

<label>Hakediş Tarihi</label>
<input id="hakedisDate" type="date" onchange="prepareMessage()">

<div class="row">
<div>
<label>Çalışma Başlangıç Tarihi</label>
<input id="periodStart" type="date" onchange="prepareMessage()">
</div>

<div>
<label>Çalışma Bitiş Tarihi</label>
<input id="periodEnd" type="date" onchange="prepareMessage()">
</div>
</div>

<label>Fatura Ödeme Günü</label>
<input id="paymentDate" type="date" onchange="prepareMessage()">

<label>Mesaj Şablonu</label>
<textarea id="template" oninput="prepareMessage()">SAYIN YÜKLENİCİ ESNAF KURYE
{isim}

HAKEDİŞİNİZ
{hakedisTarihi} TARİHLİ
{tutar} TL KDV DAHİL HİZMET BEDELİ

AÇIKLAMA
{aciklama}

FATURA ÖDEME GÜNÜ
{odemeGunu}

FATURA BİLGİLERİ
DELİVERA EKSPRESS KURYE ARACILIK HİZMETLERİ TİCARET LİMİTED ŞİRKETİ
VD İSTİKLAL
VD NO 274 228 18 00
YENİŞEHİR MERSİN

E Arşiv faturanızı muhasebe telefonuna kesinlikle iletiniz
Muhasebe WP 0530 339 72 01</textarea>

<h3>📨 Önizleme</h3>
<div id="preview" class="preview">Mesaj burada görünecek</div>

<br>

<button class="success" onclick="sendWhatsApp()">Tek Kişiye WhatsApp Aç</button>
<button class="primary" onclick="sendBulkWhatsApp()">Seçili Kişileri Sekme Sekme Aç</button>
<button class="dark" onclick="copyMessage()">Mesajı Kopyala</button>

<div class="mini">Not: Hakediş tutarı seçili kişiye özel kaydedilir ✅</div>
</div>

</div>
</div>

<script>
let people = JSON.parse(localStorage.getItem("people")) || [];

function savePeople(){
  localStorage.setItem("people", JSON.stringify(people));
}

function cleanMessage(message){
  return message
    .replace(/\n{3,}/g, "\n\n")
    .replace(/[ \t]+$/gm, "")
    .trim();
}

function normalizePhone(phone){
  phone = phone.replace(/\D/g, "");
  if(phone.startsWith("0")) phone = "90" + phone.substring(1);
  if(!phone.startsWith("90")) phone = "90" + phone;
  return phone;
}

function addPerson(){
  const name = document.getElementById("name").value.trim();
  const phoneRaw = document.getElementById("phone").value.trim();

  if(!name || !phoneRaw){
    alert("İsim ve telefon gir kanka");
    return;
  }

  people.push({
    id: Date.now(),
    name,
    phone: normalizePhone(phoneRaw),
    amount: ""
  });

  savePeople();

  document.getElementById("name").value = "";
  document.getElementById("phone").value = "";

  renderPeople();
}

function deletePerson(id){
  if(!confirm("Bu kişiyi silmek istiyor musun?")) return;

  people = people.filter(p => p.id !== id);
  savePeople();
  renderPeople();
}

function renderPeople(){
  const list = document.getElementById("personList");
  const select = document.getElementById("selectedPerson");

  list.innerHTML = "";
  select.innerHTML = "";

  if(people.length === 0){
    list.innerHTML = "<p>Henüz kişi yok</p>";
    select.innerHTML = "<option>Kişi yok</option>";
    document.getElementById("selectedAmount").value = "";
    prepareMessage();
    return;
  }

  people.forEach(person => {
    const div = document.createElement("div");
    div.className = "person";

    div.innerHTML = `
      <div>
        <input class="checkbox person-check" type="checkbox" value="${person.id}">
        <b>${person.name}</b><br>
        <small>+${person.phone}</small>
      </div>
      <button class="danger" onclick="deletePerson(${person.id})">Sil</button>
    `;

    list.appendChild(div);

    const option = document.createElement("option");
    option.value = person.id;
    option.textContent = person.name;
    select.appendChild(option);
  });

  loadSelectedAmount();
  prepareMessage();
}

function getSelectedPerson(){
  const id = Number(document.getElementById("selectedPerson").value);
  return people.find(p => p.id === id);
}

function loadSelectedAmount(){
  const person = getSelectedPerson();
  document.getElementById("selectedAmount").value = person ? person.amount || "" : "";
}

function saveSelectedAmount(){
  const person = getSelectedPerson();
  if(!person) return;

  person.amount = document.getElementById("selectedAmount").value.trim();
  savePeople();
  prepareMessage();
}

function getSelectedPeople(){
  const checked = document.querySelectorAll(".person-check:checked");
  return Array.from(checked).map(c => people.find(p => p.id === Number(c.value))).filter(Boolean);
}

function selectAllPeople(){
  document.querySelectorAll(".person-check").forEach(c => c.checked = true);
}

function clearSelections(){
  document.querySelectorAll(".person-check").forEach(c => c.checked = false);
}

function formatDateFull(dateValue){
  if(!dateValue) return "";
  const parts = dateValue.split("-");
  return parts[2] + "." + parts[1] + "." + parts[0];
}

function formatDateShort(dateValue){
  if(!dateValue) return "";
  const parts = dateValue.split("-");
  return parts[2] + "." + parts[1];
}

function getPeriodText(){
  const start = document.getElementById("periodStart").value;
  const end = document.getElementById("periodEnd").value;

  if(!start || !end) return "AÇIKLAMA";

  return formatDateShort(start) + "-" + formatDateFull(end);
}

function buildMessage(person){
  const hakedisTarihi = formatDateFull(document.getElementById("hakedisDate").value);
  const tutar = person.amount || "TUTAR";
  const aciklama = getPeriodText();
  const odemeGunu = formatDateFull(document.getElementById("paymentDate").value);
  const template = document.getElementById("template").value;

  return template
    .replaceAll("{isim}", person.name)
    .replaceAll("{hakedisTarihi}", hakedisTarihi || "HAKEDİŞ TARİHİ")
    .replaceAll("{tutar}", tutar)
    .replaceAll("{aciklama}", aciklama)
    .replaceAll("{odemeGunu}", odemeGunu || "ÖDEME GÜNÜ");
}

function prepareMessage(){
  const person = getSelectedPerson();

  if(!person){
    document.getElementById("preview").textContent = "Önce kişi ekle";
    return "";
  }

  const message = cleanMessage(buildMessage(person));
  document.getElementById("preview").textContent = message;
  return message;
}

function sendWhatsApp(){
  const person = getSelectedPerson();

  if(!person){
    alert("Kişi seçilmedi");
    return;
  }

  const message = cleanMessage(buildMessage(person));
  const url = `https://wa.me/${person.phone}?text=${encodeURIComponent(message)}`;
  window.open(url, "_blank");
}

function sendBulkWhatsApp(){
  const selectedPeople = getSelectedPeople();

  if(selectedPeople.length === 0){
    alert("Önce en az 1 kişi seç kanka");
    return;
  }

  if(!confirm(selectedPeople.length + " kişi için WhatsApp sekmeleri açılacak. Devam edilsin mi?")){
    return;
  }

  const tabs = selectedPeople.map(() => window.open("about:blank", "_blank"));

  selectedPeople.forEach((person, index) => {
    const message = cleanMessage(buildMessage(person));
    const url = `https://wa.me/${person.phone}?text=${encodeURIComponent(message)}`;

    setTimeout(() => {
      if(tabs[index]){
        tabs[index].location.href = url;
      }else{
        alert("Tarayıcı bazı sekmeleri engelledi. Pop-up izni vermen gerekiyor.");
      }
    }, index * 900);
  });
}

function copyMessage(){
  const message = prepareMessage();

  navigator.clipboard.writeText(message).then(() => {
    alert("Mesaj kopyalandı ✅");
  });
}

document.getElementById("hakedisDate").value = "2026-05-01";
document.getElementById("periodStart").value = "2026-04-20";
document.getElementById("periodEnd").value = "2026-04-26";
document.getElementById("paymentDate").value = "2026-04-30";

renderPeople();
</script>

</body>
</html>
